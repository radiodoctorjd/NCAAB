<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NCAA men's basketball game predictions: winners, spreads, totals and team totals.">
<title>NCAAB Model Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky scoreboard header with day/tab switcher, filter rail, responsive grid of game cards; tables for teams, conferences, accuracy. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EBF1; --fg:#132033; --muted:#5A6779; --line:#D3DAE4;
  --accent:#C9661A; --accent-soft:#F7E3D2; --court:#1F4E8C; --court-soft:#DCE7F5;
  --good:#1B7A4B; --good-bg:#D9F0E3; --warn:#8F5E00; --warn-bg:#FBEBC6; --bad:#B03535; --bad-bg:#F7DADA;
  --away:#8A96A8; --home:#1F4E8C;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121A; --surface:#131B26; --surface-2:#1A2431; --fg:#E4EAF2; --muted:#93A0B3; --line:#253244;
  --accent:#F08B32; --accent-soft:#3A2614; --court:#6FA3E8; --court-soft:#182A42;
  --good:#52C78F; --good-bg:#143224; --warn:#E3B24E; --warn-bg:#3A2E12; --bad:#F27D7D; --bad-bg:#3D1B1B;
  --away:#5D6A7D; --home:#6FA3E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121A; --surface:#131B26; --surface-2:#1A2431; --fg:#E4EAF2; --muted:#93A0B3; --line:#253244;
  --accent:#F08B32; --accent-soft:#3A2614; --court:#6FA3E8; --court-soft:#182A42;
  --good:#52C78F; --good-bg:#143224; --warn:#E3B24E; --warn-bg:#3A2E12; --bad:#F27D7D; --bad-bg:#3D1B1B;
  --away:#5D6A7D; --home:#6FA3E8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand h1 b{color:var(--accent);font-weight:700}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px}
nav.tabs a:hover{color:var(--fg);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{color:var(--accent-ink,#fff);background:var(--court);color:#fff}
:root[data-theme="dark"] nav.tabs a[aria-current="page"]{color:#0C121A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a[aria-current="page"]{color:#0C121A}}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 40px}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.notice p{margin:0;flex:1 1 260px;min-width:0}
.notice.err{border-left-color:var(--bad)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.dayhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.dayhead .sub{color:var(--muted);font-size:14px}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px}
.filters input[type=search],.filters select{font:inherit;font-size:14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 200px;max-width:280px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--court-soft);color:var(--court)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--court);width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.final{opacity:.92}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.meta .time{font-family:var(--display);font-weight:600;font-size:16px;color:var(--fg);letter-spacing:.02em}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--bad-bg);color:var(--bad)}
.pill.final{background:var(--surface-2);color:var(--fg)}
.pill.neutral{background:var(--court-soft);color:var(--court)}
.pill.strong{background:var(--good-bg);color:var(--good)}
.pill.moderate{background:var(--warn-bg);color:var(--warn)}
.pill.toss{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.miss{background:var(--bad-bg);color:var(--bad)}
.meta .right{margin-left:auto;display:flex;gap:6px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px 12px;align-items:center}
.team-id{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;flex:none;min-height:1px}
.team-id .abbr{font-family:var(--display);font-weight:700;font-size:16px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.team-id img{display:block;width:30px;height:30px;object-fit:contain}
.tname{display:flex;align-items:center;gap:8px;min-width:0}
.tname strong{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname.pick strong{color:var(--fg)}
.tname:not(.pick) strong{color:var(--muted);font-weight:500}
.conf{font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.conf.t1{border-color:var(--court);color:var(--court)}
.conf.t2{border-color:var(--accent);color:var(--accent)}
.wp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.pts{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;min-width:3.2ch}
.pts small{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.score{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--away);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--home);margin-left:auto}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.lines div{min-width:0}
.lines dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lines dd{margin:0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lines dd.mk{font-weight:500;color:var(--muted)}
.leans{display:flex;flex-wrap:wrap;gap:6px}
.lean{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.lean em{font-style:normal;font-weight:500;opacity:.8}
details.more summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"− ";}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
tbody tr:hover{background:var(--surface-2)}
td.team{font-weight:600}
.section-h{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 10px}
.cbars{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.cbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.cbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .track{position:relative;height:14px}
.cbar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.cbar .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.cbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.accgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.accgrid h3{font-family:var(--display);font-size:20px;margin:0 0 8px}
.note{color:var(--muted);font-size:13px;margin-top:10px;max-width:70ch}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:16px 28px;display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--court)}
.skel{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.muted{color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>NCAAB <b>Model</b> Picks</h1><small id="srcLabel">Loading…</small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#tomorrow" data-v="tomorrow">Tomorrow</a>
      <a href="#teams" data-v="teams">Teams</a>
      <a href="#conferences" data-v="conferences">Conferences</a>
      <a href="#accuracy" data-v="accuracy">Accuracy</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <div id="view"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>

<footer>
  <div class="wrap">
    <span id="updated"></span>
  </div>
</footer>

<script>
(() => {
const SHEET_ID = "1jyHIcDf8Z7Yo8omiD44ToEcQXofiGdoU96WE6VYMjHc";
const SERVER = "Google Sheets";
const RANGES = {
  preds: "Predictions!A1:AM3000",
  teams: "Teams!A1:M400",
  confs: "Conferences!A1:I40",
  acc: "Accuracy!A3:E19",
  settings: "Settings!A5:B24"
};
// Predictions columns (0-based)
const C = {date:0,tip:1,away:2,home:3,neutral:4,status:5,as:6,hs:7,line:8,ou:9,mkt:10,aO:11,aD:12,aT:13,hO:14,hD:15,hT:16,aConf:17,hConf:18,type:19,poss:20,aPts:21,hPts:22,spread:23,total:24,aWin:25,hWin:26,pick:27,pickWin:28,conf:29,mmm:30,ats:31,tmm:32,ou_l:33,res:34,atsRes:35,ouRes:36};

const S = { preds:null, teams:null, confs:null, acc:null, settings:null, source:"none", storedAt:null, liveErr:null };
const ui = { q:"", conf:"all", tier:"all", edges:false, hideNd1:false, sort:"tip", teamQ:"", teamConf:"all", teamSort:{k:"net",dir:-1} };
try { const s = JSON.parse(localStorage.getItem("ncaab-ui")||"{}"); if (typeof s.hideNd1==="boolean") ui.hideNd1=s.hideNd1; if (s.sort) ui.sort=s.sort; } catch(e) {}
function saveUi(){ try{ localStorage.setItem("ncaab-ui", JSON.stringify({hideNd1:ui.hideNd1, sort:ui.sort})); }catch(e){} }

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(v){ if (v==null || v==="") return null; const s=String(v).replace(/,/g,"").trim(); const pct=s.endsWith("%"); const x=parseFloat(s.replace("%","")); return isNaN(x)?null:(pct?x/100:x); }
const f1 = x => x==null ? "—" : x.toFixed(1);
const minus = s => s.replace(/-/g,"−");
const pct = x => x==null ? "—" : (x*100 >= 99.95 ? ">99.9" : x*100 < 0.05 ? "<0.1" : (x*100).toFixed(1)) + "%";
const cell = (r,i) => (r && r[i] != null) ? r[i] : "";

function favLine(sp, away, home){
  if (sp==null) return "—";
  if (Math.abs(sp) < 0.05) return "Pick'em";
  return (sp < 0 ? home : away) + " " + minus("-" + Math.abs(sp).toFixed(1));
}
function dateKey(s){ s=String(s||""); let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${+m[1]}/${+m[2]}/${m[3]}`; m = s.match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[2]}/${+m[3]}/${m[1]}` : ""; }
function dateLabel(k){ const m=k.match(/(\d+)\/(\d+)\/(\d+)/); if(!m) return k; const d=new Date(+m[3], +m[1]-1, +m[2]); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); }
function tipTime(s){ const m = String(s||"").match(/(\d{1,2}:\d{2}\s*[AP]M)/i); return m ? m[1] : String(s||""); }
function tipMinutes(s){ const m = String(s||"").match(/(\d{1,2}):(\d{2})\s*([AP]M)/i); if(!m) return 9999; let h=+m[1]%12; if(m[3].toUpperCase()==="PM") h+=12; return h*60 + +m[2]; }

function settingsMap(){ const m={}; (S.settings||[]).forEach(r => { if (r && r[0]) m[r[0]] = r[1]; }); return m; }
function slateKey(which){ const d=new Date(Date.now() + (which==="tomorrow"?864e5:0)); return dateKey(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric"}).format(d)); }
function confInfo(){ const out={}; (S.confs||[]).slice(1).forEach(r => { if(!r[0]) return; out[r[0]] = {name:r[1], teams:num(r[2]), o:num(r[3]), d:num(r[4]), net:num(r[5]), rank:num(r[6]), vs:num(r[7]), tier:r[8]||""}; }); return out; }
function tierClass(code, ci){ const t=(ci[code]||{}).tier||""; return t==="Power" ? "t1" : t==="Upper mid-major" ? "t2" : ""; }

function games(){ return (S.preds||[]).slice(1).filter(r => r && r[C.away]).map((r,i) => ({r,i,key:dateKey(r[C.date])})); }

/* ---------- Views ---------- */
function currentView(){ const h=(location.hash||"").replace("#",""); return ["today","tomorrow","teams","conferences","accuracy"].includes(h) ? h : "today"; }
function render(){
  const v = currentView();
  document.querySelectorAll("nav.tabs a").forEach(a => { if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderSource();
  if (!S.preds) { if (S.source==="none" && S.liveErr) $("#view").innerHTML = `<div class="empty">No predictions loaded yet.</div>`; return; }
  if (v==="today" || v==="tomorrow") renderDay(v);
  else if (v==="teams") renderTeams();
  else if (v==="conferences") renderConfs();
  else renderAccuracy();
}

function renderSource(){
  const lab = $("#srcLabel");
  if (S.source==="live") lab.textContent = "Live from the model sheet";
  else if (S.source==="snapshot") lab.textContent = "Saved snapshot";
  else lab.textContent = S.liveErr ? "Not connected" : "Loading…";
  const up = $("#updated");
  up.textContent = S.lastUpdate ? `Last data update: ${S.lastUpdate}` : "";
}

function renderDay(which){
  const key = slateKey(which);
  const ci = confInfo();
  const all = games().filter(g => g.key===key);
  const finals = all.filter(g => g.r[C.status]==="Final");
  const correct = finals.filter(g => g.r[C.res]==="Correct").length;
  const strong = all.filter(g => g.r[C.conf]==="Strong").length;
  const atsN = all.filter(g => hasLean(g.r[C.ats])).length;
  const ouN = all.filter(g => hasLean(g.r[C.ou_l])).length;
  const live = all.filter(g => g.r[C.status]==="In Progress").length;

  let list = all.filter(g => {
    const r=g.r;
    if (ui.hideNd1 && r[C.type]==="vs Non-D1") return false;
    if (ui.tier!=="all" && r[C.conf]!==ui.tier) return false;
    if (ui.conf!=="all" && r[C.aConf]!==ui.conf && r[C.hConf]!==ui.conf) return false;
    if (ui.edges && !hasLean(r[C.ats]) && !hasLean(r[C.ou_l])) return false;
    if (ui.q){ const q=ui.q.toLowerCase(); if(!(r[C.away].toLowerCase().includes(q) || r[C.home].toLowerCase().includes(q))) return false; }
    return true;
  });
  const sorters = {
    tip: (a,b) => tipMinutes(a.r[C.tip]) - tipMinutes(b.r[C.tip]) || a.i-b.i,
    prob: (a,b) => (num(b.r[C.pickWin])||0) - (num(a.r[C.pickWin])||0),
    close: (a,b) => Math.abs(num(a.r[C.spread])||0) - Math.abs(num(b.r[C.spread])||0),
    edge: (a,b) => gap(b.r) - gap(a.r),
    total: (a,b) => (num(b.r[C.total])||0) - (num(a.r[C.total])||0)
  };
  list.sort(sorters[ui.sort] || sorters.tip);

  const confOpts = Object.keys(ci).sort((a,b)=>(ci[a].name||a).localeCompare(ci[b].name||b)).map(c => `<option value="${esc(c)}"${ui.conf===c?" selected":""}>${esc(ci[c].name||c)}</option>`).join("");
  const segBtn = (val,label) => `<button type="button" data-tier="${val}" aria-pressed="${ui.tier===val}">${label}</button>`;
  $("#view").innerHTML = `
    <div class="dayhead">

/* ---------- Team logos (ESPN) ----------
   The sheet has school names but no IDs, so the page loads ESPN's list of
   Division I teams once (cached in the browser for a week) and matches each
   name to an ESPN team for its abbreviation and logo. Names that don't match
   (or non-D1 opponents) just show no logo. */
const ESPN_TEAMS_URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams?limit=500";
const ESPN_CACHE_KEY = "ncaab-espn-teams-v2";
let ESPN = null;   // normalized name -> [abbreviation, ESPN team id]
const normName = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/&/g," and ").replace(/\bsaint\b/g,"st").replace(/\bstate\b/g,"st").replace(/[^a-z0-9]/g,"");
// Sheet (Torvik-style) name -> ESPN name, for schools the two spell differently (both normalized)
const NAME_ALIASES = {
  connecticut:"uconn", miamifl:"miami", mississippi:"olemiss", louisianamonroe:"ulmonroe", louisianalafayette:"louisiana",
  illinoischicago:"uic", umkc:"kansascity", nebraskaomaha:"omaha", tennesseemartin:"utmartin", penn:"pennsylvania",
  liu:"longislanduniversity", liubrooklyn:"longislanduniversity", detroit:"detroitmercy", gramblingst:"grambling",
  samhoustonst:"samhouston", mcneesest:"mcneese", nichollsst:"nicholls", albany:"ualbany", loyolamd:"loyolamaryland",
  texasaandmcorpuschris:"texasaandmcorpuschristi", arkansaslittlerock:"littlerock", southeasternlouisiana:"selouisiana",
  stfrancispa:"stfrancis", calbaptist:"californiabaptist", seattle:"seattleu", iupui:"iuindianapolis", iuindy:"iuindianapolis",
  massachusetts:"umass", stthomas:"stthomasminnesota", collegeofcharleston:"charleston", texasaandmcommerce:"easttexasaandm",
  arkansaspinebluff:"arkansaspinebluff", southcarolinaupstate:"uscupstate", centralconnecticutst:"centralconnecticut",
  ucsantabarbara:"ucsantabarbara", floridainternational:"fiu", mountstmarys:"mountstmarys", queensnc:"queens"
};
function espnTeam(name){
  if (!ESPN || !name) return null;
  const k = normName(name);
  const hit = ESPN[NAME_ALIASES[k] || k] || ESPN[k];
  if (hit) return hit;
  // Shortened sheet names (e.g. "...Corpus Chris"): accept a single ESPN name that starts with it
  if (k.length >= 8) { const m = Object.keys(ESPN).filter(x => x.startsWith(k)); if (m.length && m.every(x => ESPN[x][1] === ESPN[m[0]][1])) return ESPN[m[0]]; }
  return null;
}
function teamId(name){
  const t = espnTeam(name);
  if (!t) return `<div class="team-id"></div>`;
  const [abbr, id] = t, base = "https://a.espncdn.com/i/teamlogos/ncaa/";
  return `<div class="team-id"><span class="abbr">${esc(abbr)}</span><picture><source srcset="${base}500-dark/${id}.png" media="(prefers-color-scheme: dark)"><img src="${base}500/${id}.png" alt="" loading="lazy" onerror="var s=this.previousElementSibling;if(s){s.remove();}else{this.style.display='none';}"></picture></div>`;
}
// Two ESPN sources, merged: (1) today's and tomorrow's men's college basketball
// scoreboards, the same feed the scores site uses, which list both teams of
// every game with ESPN id, abbreviation and logo; (2) ESPN's full team list,
// cached for a week when it loads. Either one alone is enough for the cards.
function addEspnTeam(map, t){
  if (!t || !t.id) return;
  const val = [t.abbreviation || "", String(t.id)];
  // Index by every name ESPN gives, most specific first (first one wins)
  [t.location, t.shortDisplayName, t.displayName, t.nickname, t.abbreviation].forEach(nm => { const k = normName(nm); if (k && !map[k]) map[k] = val; });
}
function mergeEspn(map){
  if (!Object.keys(map).length) return;
  ESPN = Object.assign({}, map, ESPN || {});
  render();
}
async function espnJSON(url){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
  try { const res = await fetch(url, {cache:"no-store", signal:ctrl.signal}); return res.ok ? await res.json() : null; }
  finally { clearTimeout(t); }
}
function etYmd(offsetDays){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(Date.now() + offsetDays*864e5));
  const g = k => (p.find(x => x.type===k)||{}).value;
  return g("year") + g("month") + g("day");
}
async function loadEspnTeams(){
  try {
    const c = JSON.parse(localStorage.getItem(ESPN_CACHE_KEY) || "null");
    if (c && c.map && Date.now() - c.at < 7*864e5) mergeEspn(c.map);
  } catch(e) {}
  const fromScoreboard = [0, 1].map(async off => {
    try {
      const data = await espnJSON(`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates=${etYmd(off)}&groups=50&limit=500`);
      const map = {};
      ((data && data.events) || []).forEach(ev => (((ev.competitions||[])[0]||{}).competitors || []).forEach(c => addEspnTeam(map, c.team)));
      mergeEspn(map);
    } catch(e) { console.warn("ESPN scoreboard (logos) failed:", e); }
  });
  const fromTeamList = (async () => {
    try {
      const data = await espnJSON(ESPN_TEAMS_URL);
      const teams = (((((data && data.sports)||[])[0]||{}).leagues||[])[0]||{}).teams || [];
      const map = {};
      teams.forEach(x => addEspnTeam(map, x.team || x));
      if (!Object.keys(map).length) return;
      try { localStorage.setItem(ESPN_CACHE_KEY, JSON.stringify({at:Date.now(), map})); } catch(e) {}
      mergeEspn(map);
    } catch(e) { console.warn("ESPN team list (logos) failed:", e); }
  })();
  await Promise.all([...fromScoreboard, fromTeamList]);
}

}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(f); f=""; }
    else if (ch==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (ch!=='\r') f+=ch;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

// Accuracy is computed here from the Predictions tab, so the page needs only three tabs.
function computeAccuracy(){
  const pct = x => (x*100).toFixed(1) + "%";
  const g = games().map(x=>x.r).filter(r => r[C.status]==="Final");
  const tiers = ["All","Strong","Moderate","Toss-up"];
  const out = [["Metric",...tiers]];
  const by = t => g.filter(r => t==="All" || r[C.conf]===t);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const graded = tiers.map(t => by(t).filter(r => r[C.res]==="Correct"||r[C.res]==="Miss"));
  out.push(["Games graded", ...graded.map(a=>String(a.length))]);
  out.push(["Winners correct", ...graded.map(a=>String(a.filter(r=>r[C.res]==="Correct").length))]);
  out.push(["Winner accuracy", ...graded.map(a=>a.length? pct(a.filter(r=>r[C.res]==="Correct").length/a.length):"—")]);
  out.push(["Avg predicted win% of pick", ...tiers.map(t=>{ const v=avg(by(t).map(r=>num(r[C.pickWin])).filter(x=>x!=null)); return v==null?"—":pct(v); })]);
  out.push(["Avg margin error (pts)", ...tiers.map(t=>{ const v=avg(by(t).map(r=>{ const a=num(r[C.as]),h=num(r[C.hs]),sp=num(r[C.spread]); return (a==null||h==null||sp==null)?null:Math.abs((a-h)-sp); }).filter(x=>x!=null)); return v==null?"—":v.toFixed(1); })]);
  out.push(["Avg total error (pts)", ...tiers.map(t=>{ const v=avg(by(t).map(r=>{ const a=num(r[C.as]),h=num(r[C.hs]),tt=num(r[C.total]); return (a==null||h==null||tt==null)?null:Math.abs(a+h-tt); }).filter(x=>x!=null)); return v==null?"—":v.toFixed(1); })]);
  const all = games().map(x=>x.r);
  const rec = col => { const w=g.filter(r=>r[col]==="Win").length, l=g.filter(r=>r[col]==="Loss").length, p=g.filter(r=>r[col]==="Push").length; return [`${w}-${l}-${p}`, (w+l)? pct(w/(w+l)) : "—"]; };
  const ats=rec(C.atsRes), ou=rec(C.ouRes);
  const withLine = all.filter(r => num(r[C.mkt])!=null);
  const tGap = avg(all.map(r=>{ const t=num(r[C.total]), m=num(r[C.ou]); return (t==null||m==null)?null:t-m; }).filter(x=>x!=null));
  const sGap = avg(withLine.map(r=>Math.abs(num(r[C.spread])-num(r[C.mkt]))));
  out.push([], ["Against the market","Value"], ["ATS record (W-L-P)", ats[0]], ["ATS win rate", ats[1]], ["O/U record (W-L-P)", ou[0]], ["O/U win rate", ou[1]],
    ["Games with a market line", String(withLine.length)], ["Avg model total minus market O/U", tGap==null?"—":(tGap>0?"+":"")+tGap.toFixed(1)], ["Avg gap, model spread vs market (pts)", sGap==null?"—":sGap.toFixed(1)]);
  return out;
}

async function loadAll(){
  try {
    const entries = await Promise.all(Object.entries(SOURCES).map(async ([name,[sheet,range]]) => {
      const res = await fetch(GVIZ(sheet,range), {cache:"no-store"});
      const text = await res.text();
      if (!res.ok || /^\s*</.test(text)) throw new Error("not shared");
      return [name, parseCSV(text)];
    }));
    entries.forEach(([n,v]) => S[n]=v);
    try {
      const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=Settings&range=A30:B30`, {cache:"no-store"});
      const row = parseCSV(await r.text())[0] || [];
      if (row[0]==="Last data update" && row[1]) S.lastUpdate = row[1];
    } catch(_) {}
    S.acc = computeAccuracy();
    S.source="live"; S.storedAt=Date.now(); S.liveErr=null;
    $("#notice").innerHTML="";
  } catch(e) {
    S.liveErr = e;
    if (!S.preds) $("#view").innerHTML = `<div class="empty">No predictions loaded.</div>`;
    $("#notice").innerHTML = `<div class="notice err"><p>Couldn't read the model sheet. In Google Sheets, open Share and set General access to "Anyone with the link" (Viewer), then reload this page.</p><button class="btn" id="nb">Try again</button></div>`;
    $("#nb").addEventListener("click", loadAll);
  }
  render();
}

window.addEventListener("hashchange", render);
render();
loadAll();
loadEspnTeams();
setInterval(() => { if (!document.hidden) loadAll(); }, 5*60*1000);
})();
